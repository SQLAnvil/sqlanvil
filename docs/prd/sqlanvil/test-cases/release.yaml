# Format: references/prd-format.md, "Test cases". One entry per T-id.
# "T" is a new empty temporary directory made for the case (as "P" in artifacts.yaml).
# "SV" is the SQLANVIL_VERSION string of version.bzl at the commit under test (1.40.0 at 9cabe4e4);
# "DV" is its DF_VERSION (3.1.8 at 9cabe4e4).
# CLI_TAR / CORE_TAR / SAMPLE_TAR are the package.tar.gz outputs of
# //packages/@sqlanvil/cli:package_tar, //packages/@sqlanvil/core:package_tar and
# //packages/sample-extension:package_tar built at the commit under test.
# "R" is a script case's repository: T/repo, a new git repository with user.name and user.email
# set, holding scripts/release_github copied from the commit under test and a version.bzl whose only
# lines are SQLANVIL_VERSION = "9.8.7" and DF_VERSION = "3.1.8", with remote "origin" set to the
# bare repository T/origin.git. WN is T/whats-new.md holding exactly these lines:
#   "# What's new", "", "## 9.8.7 — Test headline with `code`", "",
#   "Intro line linking [guide](/docs/guide/).", "", "- item", "", "## 9.8.6 — Older", "", "Old body."
# Every release_github case sets WHATS_NEW=WN unless it says otherwise.
# HEADER is the 13 lines of LICENSE_HEADER in packages/index.bzl, from
# "// Copyright 2023 Google LLC" to "// limitations under the License.".
T-025.1:
  ac: AC-025.1
  level: integration
  refs: ["testing.md#Harness"]
  target: code://packages/@sqlanvil/cli:package_tar
  environment: local
  identity: none
  preconditions: []
  input: {archive: CLI_TAR, read: "the entry names of the archive, sorted by byte value"}
  expect:
    output: {entries: [package/LICENSE, package/NOTICE, package/README.md, package/bundle.js, package/package.json, package/worker_bundle.js]}
    effects: []
    errors: []
    leaks: none
