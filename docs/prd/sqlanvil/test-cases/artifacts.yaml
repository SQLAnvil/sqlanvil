    graph: *G1
    call: "writeArtifacts(G1, Q, {runResult: R1, runId: 123})"
  expect:
    output: {targetDir: "Q/target"}
    effects: ["Q/target/catalog holds actions.parquet, dependencies.parquet and columns.parquet", "Q/target/runs holds run_123.parquet"]
