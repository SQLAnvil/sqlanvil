# Format: references/prd-format.md, "Test cases". One entry per T-id.
# Enum values (enumType, status) name the member of that name in sqlanvil.TableType,
# sqlanvil.RunResult.ExecutionStatus or sqlanvil.ActionResult.ExecutionStatus.
# "P" is a new empty temporary directory made for the case. CLI cases run the sqlanvil CLI
# binary with NO_COLOR=1 and capture stdout, stderr and the exit code.
# &G1 is defined in T-001.1 and &R1 in T-005.1; later cases reuse them as *G1 and *R1.
T-001.1:
  ac: AC-001.1
  level: integration
  refs: ["testing.md#Harness"]
  target: code:sa/cli/api/commands/artifacts.writeArtifacts
  environment: local
  identity: none
  preconditions: []
  input:
    project_dir: P (no target/ in it)
    graph: &G1
      tables:
        - {target: {schema: s, name: src}, enumType: TABLE, tags: [daily], fileName: definitions/src.sqlx, actionDescriptor: {description: source, columns: [{path: [id], description: the id}]}}
        - {target: {schema: s, name: v}, enumType: VIEW, dependencyTargets: [{schema: s, name: src}]}
      assertions:
        - {target: {schema: s, name: a}, dependencyTargets: [{schema: s, name: v}]}
      operations: []
      exports: []
      declarations: []
    call: "writeArtifacts(G1, P)"
  expect:
    output: {targetDir: "P/target"}
    effects:
      - "file exists: P/target/catalog/actions.parquet"
      - "file exists: P/target/catalog/dependencies.parquet"
      - "file exists: P/target/catalog/columns.parquet"
    errors: []
    leaks: none
T-001.2:
  ac: AC-001.2
  level: integration
  refs: ["testing.md#Harness"]
  target: code:sa/cli/api/commands/artifacts.writeArtifacts
  environment: local
  identity: none
  preconditions: []
  input:
    call: "writeArtifacts(G1, P)"
    graph: *G1
    read_back: "queryParquet(\"select name, type from pragma_table_info('<view>') order by cid\") for each of the views actions, dependencies, columns over the three files"
  expect:
    output:
      actions: [{name: target_key, type: VARCHAR}, {name: database, type: VARCHAR}, {name: schema, type: VARCHAR}, {name: name, type: VARCHAR}, {name: readable_name, type: VARCHAR}, {name: type, type: VARCHAR}, {name: tags, type: VARCHAR}, {name: disabled, type: BOOLEAN}, {name: file_name, type: VARCHAR}, {name: description, type: VARCHAR}]
      dependencies: [{name: from_target_key, type: VARCHAR}, {name: to_target_key, type: VARCHAR}, {name: from_readable, type: VARCHAR}, {name: to_readable, type: VARCHAR}]
      columns: [{name: target_key, type: VARCHAR}, {name: readable_name, type: VARCHAR}, {name: column_name, type: VARCHAR}, {name: description, type: VARCHAR}]
    effects: []
    errors: []
    leaks: none
T-001.3:
  ac: AC-001.3
