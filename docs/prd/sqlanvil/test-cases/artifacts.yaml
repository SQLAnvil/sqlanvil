T-006.1:
  ac: AC-006.1
  level: integration
  refs: ["testing.md#Harness"]
  target: code:sa/cli/api/commands/artifacts.writeArtifacts
  environment: local
  identity: none
  preconditions: []
  known-failing: E-003
  symptom: "every column of the empty actions file over P has type JSON, where the actions file over P2 has VARCHAR, and BOOLEAN for disabled"
  input:
    graph: {tables: [], operations: [], assertions: [], exports: [], declarations: []}
    call: "writeArtifacts(graph, P)"
    read_back:
      - "queryParquet('select count(*) as n from actions') over P/target/catalog/actions.parquet"
      - "queryParquet(\"select name from pragma_table_info('actions') order by cid\")"
      - "the same two reads for dependencies and columns"
      - "queryParquet(\"select name, type from pragma_table_info('<view>') order by cid\") for actions, dependencies and columns, over P and over a second directory P2 written by writeArtifacts(G1, P2)"
  expect:
    output:
      column_types: "for each of the three files, the (name, type) list over P equals the one over P2"
      actions_count: [{n: 0}]
      actions_columns: [target_key, database, schema, name, readable_name, type, tags, disabled, file_name, description]
      dependencies_count: [{n: 0}]
      dependencies_columns: [from_target_key, to_target_key, from_readable, to_readable]
      columns_count: [{n: 0}]
      columns_columns: [target_key, readable_name, column_name, description]
    effects: []
    errors: []
    leaks: none
