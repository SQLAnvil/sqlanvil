    second_call: "writeArtifacts({tables: [{target: {schema: s, name: only}, enumType: TABLE}], operations: [], assertions: [], exports: [], declarations: []}, P)"
    read_back: "queryParquet('select readable_name from actions') over P/target/catalog/actions.parquet"
  expect:
