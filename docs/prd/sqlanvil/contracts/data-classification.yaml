# Format: references/prd-format.md, "Contract YAML shapes".
# Required content:
#  - per table: `retention`, `deletion`, and each column as public, internal, confidential or pii
#  - `masking` for logs, errors and fixtures
#  - fixtures hold synthetic PII only, never real personal data
# Every artifact column is internal (it describes the user's project), except runs.error_message, which is confidential because warehouse error text can quote data values (A-04, confirmed by the owner 2026-11-22).
tables:
  actions:
    retention: replaced on every compile and run that writes artifacts
    deletion: sqlanvil never deletes it; the user deletes target/
    columns: {target_key: internal, database: internal, schema: internal, name: internal, readable_name: internal, type: internal, tags: internal, disabled: internal, file_name: internal, description: internal}
  dependencies:
    retention: replaced on every compile and run that writes artifacts
    deletion: sqlanvil never deletes it; the user deletes target/
    columns: {from_target_key: internal, to_target_key: internal, from_readable: internal, to_readable: internal}
  columns:
    retention: replaced on every compile and run that writes artifacts
    deletion: sqlanvil never deletes it; the user deletes target/
    columns: {target_key: internal, readable_name: internal, column_name: internal, description: internal}
  runs:
    retention: one file per run (target/runs/run_<run id>.parquet), kept indefinitely
    deletion: sqlanvil never deletes it; the user deletes target/runs/
    columns: {run_id: internal, run_status: internal, target_key: internal, readable_name: internal, status: internal, start_millis: internal, end_millis: internal, duration_millis: internal, error_message: confidential}
  run_summary:
    retention: one file per run (target/run_summary/run_<run id>.parquet), kept indefinitely
    deletion: sqlanvil never deletes it; the user deletes target/run_summary/
    columns: {run_id: internal, run_status: internal}
masking:
  logs: "connection passwords, tokens and keys from .df-credentials.json never appear in CLI stdout or stderr"
  errors: "warehouse error text may appear (it is confidential, as runs.error_message), but never a credential value"
  fixtures: "synthetic names and values only, never rows copied from a real warehouse"
